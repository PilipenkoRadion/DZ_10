{% extends "base.html" %}
{% block title %}Войти — Riebook{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <i class="bi bi-book-half fs-1 text-warning"></i>
                    <h4 class="fw-bold mt-2">Вход в Riebook</h4>
                    <p class="text-muted small">Рады видеть вас снова!</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Имя пользователя</label>
                        <input type="text" name="login" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Пароль</label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 fw-bold mt-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                    </button>
                </form>

                <hr class="my-3 text-muted">
                <p class="text-center text-muted small mb-2">или войдите через</p>

                <a href="{% url 'google_login' %}" class="btn btn-outline-dark w-100"></a>
                    <img src="https://developers.google.com/identity/images/g-logo.png" width="18" class="me-2">
                    Войти через Google
                </a>

                <hr class="my-3">
                <p class="text-center small mb-0">
                    Нет аккаунта?
                    <a href="{% url 'books:register' %}" class="text-warning fw-semibold text-decoration-none">
                        Зарегистрироваться
                    </a>
                </p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
