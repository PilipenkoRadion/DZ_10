{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <title>{% translate "Step 2" %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'books:home' %}">{% translate "Book Store" %}</a>
            <a href="{% url 'books:home' %}" class="btn btn-outline-light btn-sm">← {% translate "To home" %}</a>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">{% translate "Book Details (Step 2)" %}</h4>

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">{% translate "Description" %}</label>
                        <textarea name="description" class="form-control" rows="3"
                            placeholder="{% translate 'Book description (up to 150 characters)' %}"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">{% translate "Availability" %}</label>
                        <select name="stock" class="form-select">
                            <option value="y">{% translate "In stock" %}</option>
                            <option value="n">{% translate "Out of stock" %}</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">{% translate "Category" %}</label>
                        <select name="category" class="form-select">
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% empty %}
                            <option disabled>{% translate "No categories available" %}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">{% translate "Book photo" %}</label>
                        <input type="file" name="photo" class="form-control" accept="image/*">
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'books:step1' %}" class="btn btn-outline-secondary">← {% translate "Back" %}</a>
                        <button type="submit" class="btn btn-success fw-bold">{% translate "Create book" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
