<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Шаг 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'books:home' %}">Книжный магазин</a>
            <a href="{% url 'books:home' %}" class="btn btn-outline-light btn-sm">← На главную</a>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">Добавление книги (Шаг 1)</h4>

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'books:home' %}" class="btn btn-outline-secondary">← Назад</a>
                        <button type="submit" class="btn btn-warning fw-bold">Далее →</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
