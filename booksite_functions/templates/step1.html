<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Шаг 1</title>
</head>

<body>
    <h1>Добавление книги (Шаг 1)</h1>

    {% if messages %}
    {% for message in messages %}
    <p class="{{ message.tags }}">{{ message }}</p>
    {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Далее</button>
    </form>
</body>

</html>
