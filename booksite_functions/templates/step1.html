{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <title>{% translate "Step 1" %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'books:home' %}">{% translate "Book Store" %}</a>
            <a href="{% url 'books:home' %}" class="btn btn-outline-light btn-sm">← {% translate "To home" %}</a>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">{% translate "Add book (Step 1)" %}</h4>

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'books:home' %}" class="btn btn-outline-secondary">← {% translate "Back" %}</a>
                        <button type="submit" class="btn btn-warning fw-bold">{% translate "Next" %} →</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
