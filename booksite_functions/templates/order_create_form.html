{% extends "base.html" %}
{% block content %}
<h1>Оформление заказа</h1>
<form method="post" action="">
    {% csrf_token %}
    <div>
        <label>Имя:</label>
        <input type="text" name="first_name" required>
    </div>
    <div>
        <label>Фамилия:</label>
        <input type="text" name="last_name" required>
    </div>
    <div>
        <label>Email:</label>
        <input type="email" name="email" required>
    </div>
    <button type="submit">Оплатить через Stripe</button>
</form>
{% endblock %}
